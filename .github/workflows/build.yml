name: Build and Release APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Fix filename spaces
        run: python3 -c "import os; [os.rename(os.path.join(r, f), os.path.join(r, f.strip())) for r, _, fs in os.walk('app/src/main/res') for f in fs if f != f.strip()]"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Build APK
        run: gradle assembleDebug

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ github.run_number }}
          name: "Chess Bot Build #${{ github.run_number }}"
          files: app/build/outputs/apk/debug/app-debug.apk


