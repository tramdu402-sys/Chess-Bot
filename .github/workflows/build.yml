name: Build and Release APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Fix file names
        run: |
          find app/src/main/res/drawable/ -type f | while read file; do
            clean_name=$(echo "$file" | tr -d ' ' | tr -d '\r')
            if [ "$file" != "$clean_name" ]; then
              mv "$file" "$clean_name"
            fi
          done

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Build APK
        run: gradle assembleDebug

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v1.1
          name: "Chess Bot v1.1"
          files: app/build/outputs/apk/debug/app-debug.apk

