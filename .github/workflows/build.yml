name: Build and Release APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Fix file names
        run: python3 -c "import os, glob; [os.rename(f, f.strip()) for f in glob.glob('app/src/main/res/drawable/*') if f != f.strip()]"

      - name: Restore signing key
        run: tr -cd 'A-Za-z0-9+/=' < app/stable.keystore.b64 | base64 -d > app/stable.keystore

      - name: Generate Release Title
        id: gen_name
        run: |
          TITLES=("Shadow Gambit" "Obsidian Knight" "Silent Rook" "Phantom Queen" "Emerald Citadel" "Valkyrie Strike")
          RUN_NUM=${{ github.run_number }}
          NAME="${TITLES[$(( RUN_NUM % ${#TITLES[@]} ))]}"
          echo "release_title=${NAME} • v1.${RUN_NUM}" >> $GITHUB_OUTPUT

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Build APK
        run: gradle assembleDebug

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: chess-bot-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.${{ github.run_number }}
          name: "${{ steps.gen_name.outputs.release_title }}"
          files: app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}